<!DOCTYPE html>
<html>
<head>
    <title>Select, Textarea and Buttons</title>
</head>
<body>

<form>

    Course:
    <select>
        <option>CSE</option>
        <option>ECE</option>
        <option>IT</option>
        <option>ME</option>
    </select>

    <br><br>

    Feedback:
    <br>

    <textarea rows="5" cols="55" placeholder="Write here..."></textarea>

    <br><br>

    <input type="submit" value="Submit">
    <input type="reset" value="Reset">
    <input type="button" value="Click Me">

</form>

</body>
</html>

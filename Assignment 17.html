<!DOCTYPE html>
<html>
<head>
    <title>Form Attributes and Input Validation</title>
</head>
<body>

<form>

    <input type="text" placeholder="Full name">
    <br><br>

    <input type="email" placeholder="you@college.edu">
    <br><br>

    <input type="tel" placeholder="10-digit mobile">
    <br><br>

    <input type="password" placeholder="Min 6 characters" minlength="6">
    <br><br>

    <input type="number" placeholder="Age" min="17">
    <br><br>

    <input type="submit" value="Register">

</form>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC College Admission 2026</title>
    <style>
        body {
            font-family: Georgia, 'Times New Roman', Times, serif;
            margin: 0;
            padding: 0;
            color: #000;
            background-color: #fff;
        }

        header, footer {
            background-color: #16217a;
            color: #ffffff;
            text-align: center;
        }

        header {
            padding: 25px 10px;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        main {
            max-width: 600px;
            margin: 30px auto;
            padding: 0 20px;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
            font-size: 16px;
        }

        caption {
            margin-bottom: 6px;
            font-size: 16px;
        }

        th, td {
            border: 1px solid #888;
            padding: 8px 10px;
            text-align: left;
        }

        th {
            background-color: #eef0f8;
            text-align: center;
            font-weight: bold;
        }

        /* Removed the outer box border here */
        fieldset {
            border: none;
            padding: 0;
            margin: 0;
        }

        legend {
            padding: 0;
            margin-bottom: 15px;
            font-size: 20px;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-size: 16px;
        }

        input[type="text"],
        input[type="email"] {
            width: 280px;
            padding: 5px;
            border: 1px solid #767676;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        select {
            padding: 5px 8px;
            border: 1px solid #767676;
            border-radius: 3px;
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        textarea {
            width: 100%;
            height: 75px;
            padding: 5px;
            border: 1px solid #767676;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        button {
            padding: 6px 12px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            background-color: #f0f0f0;
            border: 1px solid #767676;
            border-radius: 2px;
            cursor: pointer;
        }

        button:hover {
            background-color: #e2e2e2;
        }

        footer {
            padding: 15px 10px;
            font-size: 15px;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <header>
        <h1>ABC College Admission 2026</h1>
    </header>

    <main>
        <h2>Courses and Fees</h2>

        <table>
            <caption>Available Courses</caption>
            <thead>
                <tr>
                    <th style="width: 45%;">Course</th>
                    <th style="width: 25%;">Seats</th>
                    <th style="width: 30%;">Fees</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>B.Tech CSE</td>
                    <td>120</td>
                    <td>&#8377;90,000</td>
                </tr>
                <tr>
                    <td>BCA</td>
                    <td>60</td>
                    <td>&#8377;45,000</td>
                </tr>
            </tbody>
        </table>

        <form action="#" method="post">
            <fieldset>
                <legend>Application Form</legend>

                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="course">Course:</label>
                    <select id="course" name="course">
                        <option value="btech-cse">B.Tech CSE</option>
                        <option value="bca">BCA</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="statement">Statement:</label>
                    <textarea id="statement" name="statement"></textarea>
                </div>

                <button type="submit">Apply</button>
            </fieldset>
        </form>
    </main>

    <footer>
        &copy; 2026 ABC College
    </footer>

</body>
</html>

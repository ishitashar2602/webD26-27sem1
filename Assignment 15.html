<!DOCTYPE html>
<html>
<head>
    <title>Form: Input Elements, Label and Fieldset</title>
</head>
<body>

<form>
    <fieldset>
        <legend>Personal Details</legend>

        Name: <input type="text" size="35">
        <br><br>

        Email: <input type="email" size="35">
        <br><br>

        Password: <input type="password" size="32">
        <br><br>

        Gender:
        <input type="radio" name="gender">Male
        <input type="radio" name="gender">Female
        <br><br>

        Hobbies:
        <input type="checkbox">Reading
        <input type="checkbox">Coding
        <br><br>

        DOB: <input type="date" size="30">

    </fieldset>
</form>

</body>
</html>
